name: Dart
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test tool example
      - run: dart run tool/generate_ids.dart --check
      - run: dart analyze --fatal-infos
      - run: dart run coverage:test_with_coverage --branch-coverage
      - run: dart run tool/check_coverage.dart coverage/coverage.json
      - run: dart run example/main.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
